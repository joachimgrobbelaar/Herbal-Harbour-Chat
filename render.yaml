services:
  - type: web
    name: herbal-harbour-chat
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: WHATSAPP_BRIDGE_PORT
        value: 3001
      - key: WHATSAPP_BRIDGE_URL
        value: http://localhost:3001
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
